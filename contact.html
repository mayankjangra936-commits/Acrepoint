      <h2>Get in Touch</h2>
      <p>We’d love to hear from you. For inquiries, property details, or site visits, please reach out using the contact form below.</p>

      <form>
        <label>Name:</label><br>
        <input type="text" style="width:100%; padding:8px; margin-bottom:10px;"><br>

        <label>Email:</label><br>
        <input type="email" style="width:100%; padding:8px; margin-bottom:10px;"><br>

        <label>Message:</label><br>
        <textarea rows="5" style="width:100%; padding:8px;"></textarea><br>

        <button style="background:#0056b3; color:white; padding:10px 20px; border:none; margin-top:10px;">Send</button>
      </form>
    </section>
